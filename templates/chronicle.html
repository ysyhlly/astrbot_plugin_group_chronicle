<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{ group_name }}·群史记</title>
<style>
  /* ============================================================
     群史记 · 魔法少女·魔女审判 夏目安安 主题
     夜空紫渐变 + 星光 ✦✧★☾ + 魔法阵角饰 + 粉金点缀
     纯 CSS 装饰（无外部图片/字体, 兼容 T2I 与 Playwright）
     ============================================================ */
  :root {
    --night-1: #171034;       /* 夜空深紫 */
    --night-2: #2a1b52;
    --night-3: #43276f;
    --ink: #f6ecff;           /* 正文亮色 */
    --ink-soft: #d8c8f0;      /* 次级文字 */
    --pink: #ff8ac2;          /* 魔女粉 */
    --pink-soft: #ffb3d9;
    --gold: #ffd97a;          /* 星金 */
    --card-border: rgba(255, 138, 194, 0.35);
    --card-bg: rgba(255, 255, 255, 0.06);
    --panel-dark: #221543;    /* 深紫面板 (代码块) */
    --glow-pink: rgba(255, 138, 194, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px;
    min-height: 1400px;
    color: var(--ink);
    font-family: "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
    font-size: 19px;
    font-weight: 500;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background:
      radial-gradient(1100px 560px at 88% -8%, rgba(255, 138, 194, 0.18), transparent 62%),
      radial-gradient(900px 500px at -8% 108%, rgba(255, 217, 122, 0.12), transparent 60%),
      radial-gradient(700px 420px at 50% 120%, rgba(255, 179, 217, 0.10), transparent 65%),
      linear-gradient(160deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%);
  }
  .chronicle-sheet {
    position: relative;
    min-height: 1400px;
    padding: 64px 72px 88px;
    overflow: hidden;
  }

  /* ---------- 夜空星光 (纯 unicode 装饰) ---------- */
  .sky-star { position: absolute; color: var(--gold); opacity: 0.85; line-height: 1; pointer-events: none; }
  .sky-star.s1 { top: 40px; left: 120px; font-size: 26px; }
  .sky-star.s2 { top: 110px; left: 330px; font-size: 14px; color: var(--pink-soft); }
  .sky-star.s3 { top: 28px; right: 250px; font-size: 18px; }
  .sky-star.s4 { top: 120px; right: 92px; font-size: 12px; color: var(--pink-soft); }
  .sky-star.s5 { top: 200px; left: 56px; font-size: 12px; }
  .sky-star.s6 { top: 186px; right: 330px; font-size: 22px; }

  /* ---------- 四角魔法阵 (同心环) ---------- */
  .magic-circle { position: absolute; border-radius: 50%; opacity: 0.5; pointer-events: none; }
  .magic-circle.tl { top: -70px; left: -70px; width: 220px; height: 220px; }
  .magic-circle.tr { top: -70px; right: -70px; width: 220px; height: 220px; }
  .magic-circle.bl { bottom: -80px; left: -80px; width: 240px; height: 240px; }
  .magic-circle.br { bottom: -80px; right: -80px; width: 240px; height: 240px; }
  .magic-circle .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid var(--card-border);
  }
  .magic-circle .ring.r2 { inset: 14px; border-style: dashed; opacity: 0.8; }
  .magic-circle .ring.r3 { inset: 30px; border: 1px solid rgba(255, 217, 122, 0.35); }
  .magic-circle .glyph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--pink-soft); font-size: 22px; opacity: 0.8;
  }

  /* ---------- 卷首 ---------- */
  header.chronicle-header {
    position: relative;
    text-align: center;
    padding: 22px 0 30px;
    margin-bottom: 34px;
    border-bottom: 1px solid rgba(255, 138, 194, 0.28);
  }
  .crescent {
    display: inline-block;
    color: var(--gold);
    font-size: 34px;
    line-height: 1;
    text-shadow: 0 0 18px rgba(255, 217, 122, 0.45);
  }
  .seal {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 76px; height: 76px;
    margin: 12px auto 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255, 138, 194, 0.9), rgba(196, 68, 148, 0.95));
    border: 2px solid rgba(255, 217, 122, 0.8);
    box-shadow: 0 0 26px var(--glow-pink), inset 0 0 14px rgba(23, 16, 52, 0.55);
    color: #fff6fc;
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 34px;
    font-weight: 800;
    transform: rotate(-6deg);
  }
  .seal::after {
    content: "";
    position: absolute; inset: 6px;
    border-radius: 50%;
    border: 1px dashed rgba(255, 217, 122, 0.55);
  }
  .chronicle-title {
    margin: 6px 0 12px;
    font-size: 56px;
    font-weight: 800;
    letter-spacing: 10px;
    line-height: 1.25;
    background: linear-gradient(180deg, var(--gold) 8%, #ffb8d6 55%, var(--pink) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: var(--gold);
    filter: drop-shadow(0 4px 18px rgba(255, 138, 194, 0.35));
  }
  .chronicle-title .group { font-size: 44px; }
  .chronicle-title .dot { color: var(--pink-soft); font-size: 40px; padding: 0 12px; }
  .chronicle-epigraph {
    margin: 0 0 18px;
    color: var(--ink-soft);
    font-size: 15px;
    letter-spacing: 4px;
  }
  .chronicle-epigraph .spark { color: var(--gold); }
  .date-pill {
    display: inline-block;
    padding: 5px 22px;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    background: rgba(255, 138, 194, 0.12);
    color: var(--pink-soft);
    font-family: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    letter-spacing: 3px;
  }

  /* ---------- 正文 (markdown 渲染结果) ---------- */
  .chronicle-content {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 42px 52px;
    box-shadow: 0 0 40px rgba(255, 138, 194, 0.10), inset 0 0 60px rgba(23, 16, 52, 0.35);
  }
  .chronicle-content h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #fff3fb;
    margin: 34px 0 16px;
    padding-bottom: 12px;
    line-height: 1.5;
    background: linear-gradient(90deg, var(--pink), rgba(255, 138, 194, 0));
    background-size: 100% 2px;
    background-repeat: no-repeat;
    background-position: left bottom;
  }
  .chronicle-content h1::before { content: "✦ "; color: var(--gold); }
  .chronicle-content h2 {
    font-size: 25px;
    font-weight: 700;
    color: #ffe6f4;
    letter-spacing: 2px;
    margin: 30px 0 14px;
    padding-left: 16px;
    border-left: 4px solid var(--pink);
    line-height: 1.5;
  }
  .chronicle-content h2::before { content: "✧ "; color: var(--gold); }
  .chronicle-content h3 {
    font-size: 21px;
    font-weight: 700;
    color: #f0e3ff;
    margin: 26px 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px dashed rgba(255, 217, 122, 0.45);
    line-height: 1.5;
  }
  .chronicle-content p { margin: 0 0 14px; text-indent: 2em; color: var(--ink); }
  .chronicle-content ul { margin: 0 0 16px; padding-left: 1.9em; list-style: none; }
  .chronicle-content li { position: relative; margin-bottom: 7px; color: var(--ink); }
  .chronicle-content li::before {
    content: "✧";
    color: var(--gold);
    font-size: 13px;
    position: absolute;
    left: -1.9em;
    top: 0.28em;
  }
  .chronicle-content strong { color: #ffffff; font-weight: 800; }
  .chronicle-content code {
    font-family: "Noto Sans Mono CJK SC", "Sarasa Mono SC", Consolas, monospace;
    font-size: 16px;
    background: rgba(255, 138, 194, 0.16);
    color: var(--pink-soft);
    padding: 2px 7px;
    border-radius: 6px;
    border: 1px solid rgba(255, 138, 194, 0.22);
  }
  .chronicle-content pre {
    background: var(--panel-dark);
    border: 1px solid rgba(255, 179, 217, 0.18);
    border-left: 4px solid var(--pink);
    padding: 18px 22px;
    margin: 16px 0 22px;
    border-radius: 14px;
    overflow-x: hidden;
    box-shadow: inset 0 0 26px rgba(23, 16, 52, 0.6);
  }
  .chronicle-content pre code {
    background: transparent;
    border: none;
    padding: 0;
    color: #e8dcff;
    white-space: pre-wrap;
    word-break: break-all;
  }
  /* 引用 → 咒术卡 (spell card): 粉色描边 + 柔光 */
  .chronicle-content blockquote.spell-card {
    position: relative;
    margin: 20px 0 22px;
    padding: 16px 24px;
    border: 1px solid var(--pink);
    border-radius: 16px;
    background: rgba(255, 138, 194, 0.10);
    box-shadow: 0 0 26px var(--glow-pink), inset 0 0 20px rgba(255, 138, 194, 0.06);
  }
  .chronicle-content blockquote.spell-card::before {
    content: "✧";
    position: absolute;
    top: 10px; left: 12px;
    color: var(--gold);
    font-size: 14px;
  }
  .chronicle-content blockquote.spell-card p {
    text-indent: 0;
    margin: 0;
    color: var(--pink-soft);
    font-size: 18px;
  }

  /* ---------- 卷尾 ---------- */
  footer.chronicle-footer {
    position: relative;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 138, 194, 0.25);
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 4px;
  }
  .footer-ring {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px;
    border: 1px solid var(--card-border);
    border-radius: 50%;
    color: var(--gold);
    font-size: 20px;
    margin-bottom: 8px;
  }
  .footer-ring::before {
    content: "";
    position: absolute; inset: 6px;
    border-radius: 50%;
    border: 1px dashed rgba(255, 217, 122, 0.5);
  }
  .footer-line { margin: 2px 0; }
  .footer-note { font-size: 13px; opacity: 0.75; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="chronicle-sheet">
  <!-- 夜空星光 -->
  <span class="sky-star s1">✦</span>
  <span class="sky-star s2">✧</span>
  <span class="sky-star s3">★</span>
  <span class="sky-star s4">✧</span>
  <span class="sky-star s5">✦</span>
  <span class="sky-star s6">✦</span>

  <!-- 四角魔法阵 -->
  <div class="magic-circle tl"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><span class="glyph">✧</span></div>
  <div class="magic-circle tr"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><span class="glyph">✦</span></div>
  <div class="magic-circle bl"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><span class="glyph">✧</span></div>
  <div class="magic-circle br"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><span class="glyph">☾</span></div>

  <header class="chronicle-header">
    <div><span class="crescent">☾</span></div>
    <div class="seal">史</div>
    <h1 class="chronicle-title"><span class="group">{{ group_name }}</span><span class="dot">·</span>群史记</h1>
    <p class="chronicle-epigraph">✦ 月之魔女在此开庭 —— 群间旧事，尽录于卷 ✦</p>
    <div class="date-pill">✦ {{ generated_at }} ✦</div>
  </header>

  <article class="chronicle-content">
{{ content|safe }}
  </article>

  <footer class="chronicle-footer">
    <div class="footer-ring">☾</div>
    <div class="footer-line">夏目安安 · 魔女审判记录</div>
    <div class="footer-note">史官谨记 · 谨录群聊旧事，勒石为记</div>
  </footer>
</div>
</body>
</html>
